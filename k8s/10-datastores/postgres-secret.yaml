# Secret holds sensitive values. Same shape as ConfigMap, different intent.
# Warning: k8s only base64-encodes this, it is NOT encrypted. Real prod uses
# External Secrets / Sealed Secrets / AWS SSM, not a committed Secret file.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: polyshop
type: Opaque              # generic key-value secret (vs docker/tls types)
stringData:               # stringData = you write plaintext, k8s encodes it
  POSTGRES_PASSWORD: change-me-locally