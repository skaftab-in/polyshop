apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: polyshop
  namespace: polyshop
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing        # public ALB, uses your public-subnet tags
    alb.ingress.kubernetes.io/target-type: ip                # route to pod IPs (VPC CNI), Services stay ClusterIP
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]' # HTTP only for now, add 443 with TLS later
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /api           # API traffic to gateway
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 3000
          - path: /              # everything else to frontend
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80