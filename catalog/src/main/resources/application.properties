# Server port
server.port=8080

# Postgres connection - all overridable by env vars so the same jar runs
# locally, in docker-compose, and in Kubernetes without changes.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:polyshop}
spring.datasource.username=${DB_USER:polyshop}
spring.datasource.password=${DB_PASSWORD:polyshop}

# Let JPA create/update tables automatically. Fine for learning.
# In real prod you would use managed migrations (Flyway/Liquibase) instead.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Actuator: expose a health endpoint for Kubernetes probes.
# /actuator/health/liveness and /actuator/health/readiness become available.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
