# Scans a pushed image for known CVEs. Runs AFTER push, not before, because
# Trivy needs a real pulled image to scan.
#
# exit-code: "0" means findings are REPORTED but don't fail the build - the
# pipeline still continues to update-manifest and deploys. Set to "1" in a
# real prod pipeline where you want CRITICAL/HIGH to block the deploy.

name: "Scan a Docker image with Trivy"
description: "Fails the job if the image has any CRITICAL or HIGH severity CVEs."

inputs:
  image-ref:
    description: "Full image reference to scan (e.g. skaftab/polyshop-catalog:abc1234)"
    required: true

runs:
  using: "composite"
  steps:
    - uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: ${{ inputs.image-ref }}
        severity: CRITICAL,HIGH
        exit-code: "0"
