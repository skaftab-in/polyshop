# Buildx + Docker Hub login combined into one action because they always
# run together in this project. Buildx enables the GHA layer cache used by
# the build-and-push step; the login provides the credentials push needs.
# Neither is useful on its own here, so bundling keeps the workflow
# readable. If you ever need one without the other, split them.

name: "Set up Docker Buildx and log in to Docker Hub"
description: "Enables Buildx (needed for the GHA layer cache) and authenticates to Docker Hub."

inputs:
  dockerhub-username:
    required: true
  dockerhub-token:
    required: true

runs:
  using: "composite"
  steps:
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-token }}
