# CI for catalog only - triggers only on catalog/** changes, no shared
# path-filter job needed since GitHub's own trigger does that filtering.

name: CI - catalog

on:
  push:
    branches: [main]
    paths:
      - "catalog/**"

permissions:
  contents: write

jobs:
  # Runs on every push touching catalog/, regardless of what else changed -
  # a leaked secret could show up anywhere in the diff.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-scan:
    needs: gitleaks
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: sha
        uses: ./.github/actions/compute-sha
      - uses: ./.github/actions/lint-dockerfile
        with:
          dockerfile: catalog/Dockerfile
      - uses: ./.github/actions/docker-setup
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: ./.github/actions/build-and-push
        with:
          context: ./catalog
          image: skaftab/polyshop-catalog
          tag: ${{ steps.sha.outputs.sha }}
      - uses: ./.github/actions/trivy-scan
        with:
          image-ref: skaftab/polyshop-catalog:${{ steps.sha.outputs.sha }}

  # The GitOps handoff - the only step that writes to k8s/. The concurrency
  # group is shared across ALL FOUR service workflows (same group name in
  # every ci-<service>.yml), so if catalog and gateway both need to update
  # the manifest at the same moment, GitHub queues them instead of letting
  # them race to push at the same time.
  update-manifest:
    needs: build-and-scan
    runs-on: ubuntu-latest
    concurrency:
      group: manifest-updates
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bump-manifest
        with:
          service: catalog
          sha: ${{ needs.build-and-scan.outputs.sha }}
