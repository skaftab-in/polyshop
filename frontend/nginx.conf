server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API calls get forwarded to the gateway service.
    # GATEWAY_HOST is substituted at container start (see Dockerfile).
    location /api/ {
        proxy_pass http://$GATEWAY_HOST:3000;
        proxy_set_header Host $host;
    }

    # SPA fallback: any unknown path serves index.html so client routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
